<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Relay · ProtectGo</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,1,800&family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>if(!window.supabase){document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');}</script>
<style>
:root{
  --pg-ink:#1B2D3A;--pg-ink-2:#162630;--pg-mint:#2DBFA3;--pg-mint-soft:#C4E8DF;--pg-mint-deep:#229A82;
  --pg-bg:#F4F7FA;--pg-card:#FFFFFF;--pg-line:#E7EDF2;--pg-txt:#28323B;--pg-muted:#6B7D89;
  --pg-pos:#1F9D6B;--pg-neg:#D5594F;--pg-warn:#B8841F;
  --pg-font-gabi:"Fraunces",Georgia,serif;--pg-font-title:"Montserrat",sans-serif;
  --pg-font-body:"Inter",sans-serif;--pg-font-num:"JetBrains Mono",monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--pg-bg);color:var(--pg-txt);font-family:var(--pg-font-body);}
.pg-app{min-height:100vh;display:flex;}
.pg-side{width:240px;background:var(--pg-ink);color:#fff;padding:26px 16px;flex-shrink:0;}
.pg-brand{display:flex;align-items:center;gap:11px;margin-bottom:24px;}
.pg-shield{width:36px;height:36px;border-radius:9px;background:linear-gradient(150deg,var(--pg-mint),var(--pg-mint-deep));display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--pg-ink);font-size:14px;font-family:var(--pg-font-title);}
.pg-wordmark{font-family:var(--pg-font-gabi);font-style:italic;font-weight:800;font-size:22px;color:var(--pg-mint);letter-spacing:-.5px;}
.nav-lbl{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#5f7382;margin:16px 8px 7px;}
.pg-side a{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;color:#b9c6d0;font-size:13.5px;font-weight:500;text-decoration:none;margin-bottom:2px;cursor:pointer;}
.pg-side a.on,.pg-side a:hover{background:rgba(45,191,163,.15);color:#fff;}
.pg-foot{margin-top:20px;padding-top:13px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:#8da0ad;line-height:1.6;}
.pg-main{flex:1;padding:28px 34px;max-width:1180px;}
.pg-eyebrow{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--pg-mint-deep);margin-bottom:6px;}
.pg-main h1{font-family:var(--pg-font-title);font-size:26px;font-weight:800;color:var(--pg-ink);margin:0;}
.pg-sub{color:var(--pg-muted);font-size:13.5px;margin:3px 0 20px;}
.pg-kpis{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
.pg-kpi{flex:1;min-width:160px;background:var(--pg-card);border:1px solid var(--pg-line);border-radius:14px;padding:15px 17px;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(27,45,58,.04);}
.pg-kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--pg-mint);}
.pg-kpi .lbl{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--pg-muted);}
.pg-kpi .val{font-family:var(--pg-font-num);font-size:24px;font-weight:600;color:var(--pg-ink);margin-top:6px;font-variant-numeric:tabular-nums;}
.pg-kpi .sub{font-size:11.5px;color:var(--pg-muted);margin-top:2px;}
.pg-card{background:var(--pg-card);border:1px solid var(--pg-line);border-radius:15px;padding:20px 22px;box-shadow:0 1px 3px rgba(27,45,58,.04);margin-bottom:18px;}
.pg-card h2{font-family:var(--pg-font-title);font-size:16px;font-weight:800;color:var(--pg-ink);margin:0 0 3px;}
.pg-card .h2sub{font-size:12px;color:var(--pg-muted);margin-bottom:14px;}
.pg-table{width:100%;border-collapse:collapse;}
.pg-table th{text-align:left;font-size:10.5px;color:var(--pg-muted);text-transform:uppercase;letter-spacing:.05em;padding:8px 6px;border-bottom:2px solid var(--pg-ink);font-weight:700;}
.pg-table td{padding:10px 6px;font-size:13px;color:#3a4751;border-bottom:1px solid var(--pg-line);vertical-align:middle;}
.pg-table td.num{font-family:var(--pg-font-num);font-variant-numeric:tabular-nums;color:var(--pg-ink);font-weight:600;}
.pg-table tr:hover td{background:#FAFCFD;}
.pg-pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap;}
.pg-pill.ok{background:#E3F4EF;color:var(--pg-pos);}
.pg-pill.fin{background:var(--pg-mint-soft);color:var(--pg-ink-2);}
.pg-pill.due{background:#FCEEEC;color:var(--pg-neg);}
.pg-pill.warn{background:#FBF3E2;color:var(--pg-warn);}
.pg-pill.n{background:#EEF1F5;color:var(--pg-ink);}
.pg-btn{background:var(--pg-ink);color:#fff;border:none;border-radius:999px;padding:9px 18px;font-family:var(--pg-font-body);font-size:13px;font-weight:600;cursor:pointer;}
.pg-btn:hover{background:var(--pg-ink-2);}
.pg-btn .a{color:var(--pg-mint);}
.pg-btn.secondary{background:transparent;color:var(--pg-ink);border:2px solid var(--pg-line);}
.pg-btn.sm{padding:5px 12px;font-size:11.5px;}
.pg-btn.mint{background:var(--pg-mint-deep);}
.field{margin-bottom:11px;}
.field label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--pg-muted);margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--pg-line);border-radius:9px;padding:9px 11px;font-family:var(--pg-font-body);font-size:13.5px;color:var(--pg-txt);background:#FAFCFD;outline:none;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pg-mint);}
.frow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:860px){.frow,.frow2{grid-template-columns:1fr;}.pg-side{display:none;}}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start;}
@media(max-width:980px){.two{grid-template-columns:1fr;}}
.evt{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--pg-line);font-size:12.5px;}
.evt:last-child{border-bottom:none;}
.evt .dot{width:8px;height:8px;border-radius:99px;background:var(--pg-mint);margin-top:5px;flex-shrink:0;}
.evt .w{color:var(--pg-muted);font-size:11px;}
.toast{position:fixed;bottom:22px;right:22px;background:var(--pg-ink);color:#fff;padding:12px 18px;border-radius:11px;font-size:13px;box-shadow:0 8px 24px rgba(27,45,58,.3);display:none;z-index:99;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--pg-bg);}
.login-card{background:#fff;border:1px solid var(--pg-line);border-radius:18px;padding:34px 36px;width:360px;box-shadow:0 10px 30px rgba(27,45,58,.08);}
.hidden{display:none !important;}
.linkish{color:var(--pg-mint-deep);cursor:pointer;font-weight:600;}
.mono{font-family:var(--pg-font-num);}
.copybox{background:#12212B;border-radius:11px;padding:14px 16px;color:#D6E4EC;font-family:var(--pg-font-num);font-size:11.5px;line-height:1.7;white-space:pre-wrap;margin-top:10px;}
.svc-price input{width:90px;font-family:var(--pg-font-num);}
/* ===== INVOICE PRINT (plantilla Operyx x ProtectGo) ===== */
#printArea{display:none;}
@media print{
  body *{visibility:hidden;}
  #printArea,#printArea *{visibility:visible;}
  #printArea{display:block;position:absolute;left:0;top:0;width:100%;}
  .pgprint-page{page-break-after:always;}
}
.pgprint{font-family:Arial,Helvetica,sans-serif;color:#333;max-width:760px;margin:0 auto;padding:40px 30px;}
.pgprint .hdr{display:flex;justify-content:flex-end;margin-bottom:8px;}
.pgprint .brand{font-family:var(--pg-font-title);font-weight:800;font-size:20px;color:#1B2D3A;}
.pgprint .brand .go{color:#2DBFA3;}
.pgprint h1{color:#5a6b76;text-align:center;letter-spacing:1px;font-size:26px;margin:18px 0 26px;font-family:Arial;}
.pgprint .meta{display:flex;justify-content:space-between;font-size:13px;margin-bottom:26px;line-height:1.8;}
.pgprint .meta b{color:#222;}
.pgprint .meta .r{text-align:right;}
.pgprint table.inv{width:100%;border-collapse:collapse;font-size:13px;}
.pgprint table.inv th{background:#f2f2f2;border:1px solid #ddd;padding:10px;font-weight:600;text-align:center;}
.pgprint table.inv th:first-child{text-align:left;}
.pgprint table.inv td{border:1px solid #ddd;padding:12px 10px;vertical-align:top;}
.pgprint table.inv td.c{text-align:center;}
.pgprint .totrow td{background:#f2f2f2;font-weight:700;}
.pgprint .terms{margin-top:40px;font-size:12.5px;line-height:1.6;}
.pgprint .terms h3{font-size:15px;color:#222;}
.pgprint .terms ol{padding-left:20px;}
.pgprint .footline{margin-top:34px;border-top:1px solid #999;padding-top:8px;text-align:center;font-style:italic;color:#777;font-size:12px;}
/* ===== DOSIER PRINT (membrete oficial ProtectGo Services) ===== */
.pgdos{font-family:Arial,Helvetica,sans-serif;color:#333;max-width:760px;margin:0 auto;padding:40px 34px;position:relative;border-top:5px solid #2DBFA3;}
.pgdos .dhdr{text-align:center;margin-bottom:22px;}
.pgdos .dbrand{font-family:var(--pg-font-title);font-weight:800;font-size:26px;color:#1B2D3A;}
.pgdos .dbrand .go{color:#2DBFA3;}
.pgdos .dsub{font-size:11px;letter-spacing:2px;color:#6B7D89;text-transform:uppercase;margin-top:2px;}
.pgdos h1{font-family:var(--pg-font-title);color:#1B2D3A;text-align:center;font-size:20px;letter-spacing:.5px;margin:22px 0 4px;}
.pgdos .dmeta-top{text-align:center;font-size:11.5px;color:#6B7D89;margin-bottom:22px;}
.pgdos .dbox{background:#EEF6F3;border-radius:12px;padding:16px 20px;margin-bottom:18px;font-size:13px;line-height:1.7;}
.pgdos .dbox b{color:#1B2D3A;}
.pgdos .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
.pgdos .dfield{border:1px solid #E7EDF2;border-radius:9px;padding:10px 13px;}
.pgdos .dfield .fl{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6B7D89;}
.pgdos .dfield .fv{font-size:13.5px;color:#1B2D3A;margin-top:2px;font-weight:600;}
.pgdos table.dinv{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;}
.pgdos table.dinv th{background:#EEF6F3;border:1px solid #E7EDF2;padding:8px;text-align:left;color:#1B2D3A;}
.pgdos table.dinv td{border:1px solid #E7EDF2;padding:8px;}
.pgdos .dfoot{margin-top:38px;border-top:1px solid #E7EDF2;padding-top:12px;text-align:center;font-size:11px;color:#6B7D89;line-height:1.8;}
.pgdos .dfoot b{color:#1B2D3A;}
.paste-zone{border:2px dashed var(--pg-mint);border-radius:12px;background:#F2FBF8;padding:22px;text-align:center;color:var(--pg-mint-deep);font-size:13px;font-weight:600;margin-bottom:14px;cursor:text;outline:none;}
.paste-zone small{display:block;color:var(--pg-muted);font-weight:500;margin-top:5px;}
.paste-zone img{max-width:100%;max-height:160px;border-radius:8px;margin-top:10px;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login-wrap">
  <div class="login-card">
    <div class="pg-brand" style="margin-bottom:18px"><div class="pg-shield">PG</div><span style="font-family:var(--pg-font-title);font-weight:800;font-size:18px;color:var(--pg-ink)">Amazon <span style="color:var(--pg-mint-deep)">Relay</span></span></div>
    <div style="font-family:var(--pg-font-title);font-weight:800;font-size:19px;color:var(--pg-ink)">ProtectGo · Operyx</div>
    <div style="font-size:12.5px;color:var(--pg-muted);margin:4px 0 18px">Herramienta del equipo Amazon Audit</div>
    <div class="field"><label>Correo</label><input id="loginEmail" type="email" value="amazonaud@protectgoservices.com"></div>
    <div class="field"><label>Contraseña</label><input id="loginPass" type="password" placeholder="••••••••"></div>
    <div id="loginErr" style="color:var(--pg-neg);font-size:12px;margin-bottom:10px;display:none"></div>
    <button class="pg-btn" style="width:100%" onclick="doLogin()">Entrar <span class="a">→</span></button>
  </div>
</div>

<!-- APP -->
<div id="appView" class="pg-app hidden">
  <nav class="pg-side">
    <div class="pg-brand"><div class="pg-shield">PG</div><span style="font-family:var(--pg-font-title);font-weight:800;font-size:16px;color:#fff">Amazon <span style="color:var(--pg-mint)">Relay</span></span></div>
    <div class="nav-lbl">Amazon Audit</div>
    <a data-v="resumen" class="on" onclick="nav('resumen')">▤ Resumen</a>
    <a data-v="clientes" onclick="nav('clientes')">👤 Clientes</a>
    <a data-v="loads" onclick="nav('loads')">📸 Cargar viaje</a>
    <a data-v="cobros" onclick="nav('cobros')">💵 Cobros</a>
    <a data-v="servicios" onclick="nav('servicios')">🛠 Servicios</a>
    <a data-v="invoices" onclick="nav('invoices')">🧾 Invoices</a>
    <div class="pg-foot">
      Amazon Relay · ProtectGo<br>
      <span id="footUser" style="color:var(--pg-mint)"></span><br>
      <span class="linkish" style="color:#8da0ad" onclick="doLogout()">Cerrar sesión</span>
    </div>
  </nav>
  <main class="pg-main" id="main"></main>
</div>

<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>
const SB_URL='https://bwqzypuiqgxzsrtsueab.supabase.co';
const SB_KEY='sb_publishable_VbA94M3mF-Z6kgtPnda-cQ_diKF8L49';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
let ME=null, CLIENTES=[], SERVICIOS=[], COBROS=[], INVOICES=[], LOADS=[], VIEW='resumen', DETALLE=null;

const $=id=>document.getElementById(id);
const fmt$=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtD=d=>d? new Date(d+(d.length===10?'T12:00:00':'')).toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600);}

const ESTADOS_COBRO=['registrado','autorizado','enviado_fam','fondos_validados','pagado'];
const ESTADOS_LOAD=['cargado','en_ruta','entregado','facturado','cobrado'];
const ESTADO_LBL={registrado:'Registrado',autorizado:'Autorizado',enviado_fam:'Enviado a FAM',fondos_validados:'Fondos validados',pagado:'Pagado',por_cobrar:'Por cobrar',anulado:'Anulado',activo:'Activo',suspendido:'Suspendido',recuperacion:'Recuperación',inactivo:'Inactivo',cargado:'Cargado',en_ruta:'En ruta',entregado:'Entregado',facturado:'Facturado',cobrado:'Cobrado'};
const ESTADO_CLS={registrado:'n',autorizado:'warn',enviado_fam:'warn',fondos_validados:'fin',pagado:'ok',por_cobrar:'warn',anulado:'due',activo:'ok',suspendido:'due',recuperacion:'warn',inactivo:'n',cargado:'n',en_ruta:'warn',entregado:'fin',facturado:'warn',cobrado:'ok'};
const pill=e=>`<span class="pg-pill ${ESTADO_CLS[e]||'n'}">${ESTADO_LBL[e]||e}</span>`;

/* ---------- AUTH ---------- */
async function doLogin(){
  const {data,error}=await sb.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPass').value});
  if(error){$('loginErr').textContent='No se pudo entrar: '+error.message;$('loginErr').style.display='block';return;}
  boot(data.user);
}
async function doLogout(){await sb.auth.signOut();location.reload();}
async function boot(user){
  ME=user;$('footUser').textContent=user.email;
  $('loginView').classList.add('hidden');$('appView').classList.remove('hidden');
  await loadAll(); render();
}
sb.auth.getSession().then(({data})=>{if(data.session) boot(data.session.user);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('loginView').classList.contains('hidden')) doLogin();});

/* ---------- DATA ---------- */
async function loadAll(){
  const [c,s,co,inv,ld]=await Promise.all([
    sb.from('amazon_clientes').select('*').order('empresa'),
    sb.from('amazon_servicios').select('*').order('orden'),
    sb.from('amazon_cobros').select('*').order('created_at',{ascending:false}),
    sb.from('amazon_invoices').select('*').order('numero_seq',{ascending:false}),
    sb.from('amazon_loads').select('*').order('created_at',{ascending:false}),
  ]);
  CLIENTES=c.data||[];SERVICIOS=s.data||[];COBROS=co.data||[];INVOICES=inv.data||[];LOADS=ld.data||[];
}
async function evento(tipo,detalle,ids={}){
  await sb.from('amazon_eventos').insert({tipo,detalle,quien:ME.email,...ids});
}
const cliName=id=>{const c=CLIENTES.find(x=>x.id===id);return c? c.empresa : '—';};
const cli=id=>CLIENTES.find(x=>x.id===id);
const esGuia=c=>(c?.empresa||'').startsWith('🧭');
const hoyISO=()=>new Date().toISOString().slice(0,10);
const haceISO=d=>{const t=new Date();t.setDate(t.getDate()-d);return t.toISOString().slice(0,10);};

/* ---------- NAV / RENDER ---------- */
function nav(v){VIEW=v;DETALLE=null;document.querySelectorAll('.pg-side a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));render();}
function render(){
  const M=$('main');
  if(VIEW==='resumen') M.innerHTML=vResumen();
  else if(VIEW==='clientes') M.innerHTML=DETALLE? vClienteDetalle(DETALLE):vClientes();
  else if(VIEW==='loads') M.innerHTML=vLoads();
  else if(VIEW==='cobros') M.innerHTML=vCobros();
  else if(VIEW==='servicios') M.innerHTML=vServicios();
  else if(VIEW==='invoices') M.innerHTML=vInvoices();
  if(VIEW==='loads') setupPasteZone();
}

/* ---------- RESUMEN ---------- */
function vResumen(){
  const mes=new Date().getMonth(),yr=new Date().getFullYear();
  const cobrosMes=COBROS.filter(c=>{const d=new Date(c.created_at);return d.getMonth()===mes&&d.getFullYear()===yr;});
  const pagadoMes=cobrosMes.filter(c=>['fondos_validados','pagado'].includes(c.estado)).reduce((a,c)=>a+Number(c.monto),0);
  const pendiente=COBROS.filter(c=>!['fondos_validados','pagado'].includes(c.estado)).reduce((a,c)=>a+Number(c.monto),0);
  const invPorCobrar=INVOICES.filter(i=>i.estado==='por_cobrar').length;
  const ult=COBROS.slice(0,8);
  return `
  <div class="pg-eyebrow">Dashboard operativo · Amazon Audit</div>
  <h1>Amazon Relay</h1>
  <div class="pg-sub">Trazabilidad de clientes, cobros semanales, tarifas e invoices.</div>
  <div class="pg-card" style="background:#F2FBF8;border-color:var(--pg-mint)">
    <h2>🧭 Guía rápida de registro</h2>
    <div class="h2sub">Sigue este orden — pocos clics, sin pasos raros:</div>
    <div style="font-size:12.8px;color:var(--pg-txt);line-height:2.1">
      <b>1.</b> 👤 Clientes → "Registrar cliente" (empresa + DOT + contrato es lo mínimo).<br>
      <b>2.</b> 📸 Cargar viaje → llena el load del cliente.<br>
      <b>3.</b> 💵 Cobros → registra el pago semanal a debitar, avanza el estado con el botón →.<br>
      <b>4.</b> En Cobros, botón 🧾 → genera el invoice automático, ya numerado.<br>
      Hay un cliente <b>🧭 EJEMPLO GUÍA</b> ya armado de punta a punta en Clientes — ábrelo para ver cómo se ve todo lleno.
    </div>
  </div>
  <div class="pg-kpis">
    <div class="pg-kpi"><div class="lbl">Clientes activos</div><div class="val">${CLIENTES.filter(c=>c.estado==='activo').length}</div><div class="sub">${CLIENTES.length} en total</div></div>
    <div class="pg-kpi"><div class="lbl">Cobrado este mes</div><div class="val">${fmt$(pagadoMes)}</div><div class="sub">${cobrosMes.length} cobros registrados</div></div>
    <div class="pg-kpi"><div class="lbl">Pendiente por validar</div><div class="val">${fmt$(pendiente)}</div><div class="sub">en flujo con FAM</div></div>
    <div class="pg-kpi"><div class="lbl">Invoices por cobrar</div><div class="val">${invPorCobrar}</div><div class="sub">${INVOICES.length} emitidos</div></div>
  </div>
  <div class="pg-card">

async function avanzarCobro(id,estado){
  let transaccion=null;

  const upd={estado};if(transaccion)upd.transaccion=transaccion;
  const {error}=await sb.from('amazon_cobros').update(upd).eq('id',id);
  if(error) return toast('Error: '+error.message);
  const c=COBROS.find(x=>x.id===id);
  await evento('cambio_estado',`Cobro pasó a ${ESTADO_LBL[estado]}${transaccion?' · Trans #'+transaccion:''}`,{cliente_id:c?.cliente_id,cobro_id:id});

  if(DETALLE) abrirCliente(DETALLE); else render();
}
function correoCobro(id){
  const c=COBROS.find(x=>x.id===id);if(!c)return;
  const cl=cli(c.cliente_id)||{};
  const per=c.periodo_desde?`del ${fmtD(c.periodo_desde)} al ${fmtD(c.periodo_hasta)}`:'';
  const subject=`Pago semanal AMAZON RELAY - ${cl.empresa||''}${cl.dba?' DBA: '+cl.dba:''} DOT # ${cl.dot||''}`;
  const body=`Buenas tardes!\n\nEl cliente relacionado en esta línea de correo AUTORIZA el cobro por ${fmt$(c.monto)}, por ${c.concepto.toLowerCase().startsWith('servicio')?c.concepto.toLowerCase():'los servicios prestados de '+c.concepto.toLowerCase()} ${per}.\n\nLa información del pago ya está en la base de datos de la agencia.\n\n¡Gracias!`;
  const out=$('correoOut');

  else {navigator.clipboard.writeText(subject+'\n\n'+body);toast('Correo copiado');}
}

async function guardarServicio(id){
  const precio=parseFloat($('sp_'+id).value)||0;
  const maxv=$('sm_'+id).value; const precio_max=maxv===''?null:parseFloat(maxv);
  const {error}=await sb.from('amazon_servicios').update({precio,precio_max}).eq('id',id);
  if(error) return toast('Error: '+error.message);
  await evento('nota',`Tarifa actualizada: ${SERVICIOS.find(s=>s.id===id)?.nombre} → ${fmt$(precio)}${precio_max?'–'+fmt$(precio_max):''}`);
  toast('Tarifa guardada');await loadAll();render();
}
async function toggleServicio(id,activo){
  await sb.from('amazon_servicios').update({activo}).eq('id',id);
  await loadAll();render();
}
async function crearServicio(){
  const nombre=$('nsNombre').value.trim();if(!nombre)return toast('Falta el nombre');
  const {error}=await sb.from('amazon_servicios').insert({nombre,descripcion:$('nsDesc').value.trim()||null,tipo:$('nsTipo').value,precio:parseFloat($('nsPrecio').value)||0,precio_max:$('nsMax').value?parseFloat($('nsMax').value):null,orden:SERVICIOS.length+1});
  if(error) return toast('Error: '+error.message);
  toast('Servicio agregado');await loadAll();render();
}

async function crearInvoice(extra){
  const cliente_id=extra?.cliente_id||$('ivCliente')?.value;
  const desc=extra?.desc||$('ivDesc')?.value.trim();
  const qty=extra?.qty??(parseFloat($('ivQty')?.value)||1);
  const rate=extra?.rate??(parseFloat($('ivRate')?.value)||0);
  const metodo=extra?.metodo??($('ivMetodo')?.value.trim()||null);
  const conFee=extra?.fee??($('ivFee')?.checked||false);
  if(!cliente_id||!desc||!rate) return toast('Falta cliente, descripción o tarifa');
  const subtotal=qty*rate;
  const fee=conFee? Math.round(subtotal*0.039*100)/100 : 0;
  const items=[{descripcion:desc,qty,rate,total:subtotal}];
  if(conFee) items.push({descripcion:'Administrative Processing Fee: Applicable for the use of the payment platform (3.9%).',qty:1,rate:fee,total:fee});
  const row={cliente_id,cobro_id:extra?.cobro_id||null,metodo_pago:metodo,items,subtotal,fee_pct:conFee?3.9:0,fee,total:subtotal+fee,created_by:ME.email};
  const {data,error}=await sb.from('amazon_invoices').insert(row).select().single();
  if(error) return toast('Error: '+error.message);
  await evento('invoice_generado',`Invoice ${data.numero} · ${fmt$(data.total)}`,{cliente_id,invoice_id:data.id});
  toast('Invoice '+data.numero+' generado');
  await loadAll();render();imprimirInvoice(data.id);
}
function invoiceDesdeCobro(cobroId){
  const c=COBROS.find(x=>x.id===cobroId);if(!c)return;
  const per=c.periodo_desde?` (${fmtD(c.periodo_desde)} – ${fmtD(c.periodo_hasta)})`:'';
  crearInvoice({cliente_id:c.cliente_id,desc:(c.tipo==='semanal'?'Dispatching Service — Amazon Relay: ':'Service / Management: ')+c.concepto+per,qty:1,rate:Number(c.monto),fee:false,cobro_id:cobroId,metodo:null});
}

      <tr class="totrow"><td colspan="3" style="text-align:right"><b>TOTAL</b></td><td class="c"><b>${fmt$(i.total)} USD</b></td></tr>
