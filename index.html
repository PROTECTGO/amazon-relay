<style>
:root{
  --pg-ink:#1B2D3A;--pg-ink-2:#162630;--pg-mint:#2DBFA3;--pg-mint-soft:#C4E8DF;--pg-mint-deep:#229A82;

}
*{box-sizing:border-box;}
body{margin:0;background:var(--pg-bg);color:var(--pg-txt);font-family:var(--pg-font-body);}
.pg-app{min-height:100vh;display:flex;}
.pg-side{width:240px;background:var(--pg-ink);color:#fff;padding:26px 16px;flex-shrink:0;}
.pg-brand{display:flex;align-items:center;gap:11px;margin-bottom:24px;}
.pg-shield{width:36px;height:36px;border-radius:9px;background:linear-gradient(150deg,var(--pg-mint),var(--pg-mint-deep));display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--pg-ink);font-size:14px;font-family:var(--pg-font-title);}
.pg-wordmark{font-family:var(--pg-font-gabi);font-style:italic;font-weight:800;font-size:22px;color:var(--pg-mint);letter-spacing:-.5px;}
.nav-lbl{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:#5f7382;margin:16px 8px 7px;}
.pg-side a{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;color:#b9c6d0;font-size:13.5px;font-weight:500;text-decoration:none;margin-bottom:2px;cursor:pointer;}
.pg-side a.on,.pg-side a:hover{background:rgba(45,191,163,.15);color:#fff;}
.pg-foot{margin-top:20px;padding-top:13px;border-top:1px solid rgba(255,255,255,.12);font-size:11px;color:#8da0ad;line-height:1.6;}
.pg-main{flex:1;padding:28px 34px;max-width:1180px;}
.pg-eyebrow{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--pg-mint-deep);margin-bottom:6px;}
.pg-main h1{font-family:var(--pg-font-title);font-size:26px;font-weight:800;color:var(--pg-ink);margin:0;}
.pg-sub{color:var(--pg-muted);font-size:13.5px;margin:3px 0 20px;}
.pg-kpis{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
.pg-kpi{flex:1;min-width:160px;background:var(--pg-card);border:1px solid var(--pg-line);border-radius:14px;padding:15px 17px;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(27,45,58,.04);}
.pg-kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--pg-mint);}
.pg-kpi .lbl{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--pg-muted);}
.pg-kpi .val{font-family:var(--pg-font-num);font-size:24px;font-weight:600;color:var(--pg-ink);margin-top:6px;font-variant-numeric:tabular-nums;}
.pg-kpi .sub{font-size:11.5px;color:var(--pg-muted);margin-top:2px;}
.pg-card{background:var(--pg-card);border:1px solid var(--pg-line);border-radius:15px;padding:20px 22px;box-shadow:0 1px 3px rgba(27,45,58,.04);margin-bottom:18px;}
.pg-card h2{font-family:var(--pg-font-title);font-size:16px;font-weight:800;color:var(--pg-ink);margin:0 0 3px;}
.pg-card .h2sub{font-size:12px;color:var(--pg-muted);margin-bottom:14px;}
.pg-table{width:100%;border-collapse:collapse;}
.pg-table th{text-align:left;font-size:10.5px;color:var(--pg-muted);text-transform:uppercase;letter-spacing:.05em;padding:8px 6px;border-bottom:2px solid var(--pg-ink);font-weight:700;}
.pg-table td{padding:10px 6px;font-size:13px;color:#3a4751;border-bottom:1px solid var(--pg-line);vertical-align:middle;}
.pg-table td.num{font-family:var(--pg-font-num);font-variant-numeric:tabular-nums;color:var(--pg-ink);font-weight:600;}
.pg-table tr:hover td{background:#FAFCFD;}
.pg-pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap;}
.pg-pill.ok{background:#E3F4EF;color:var(--pg-pos);}
.pg-pill.fin{background:var(--pg-mint-soft);color:var(--pg-ink-2);}

.pg-btn{background:var(--pg-ink);color:#fff;border:none;border-radius:999px;padding:9px 18px;font-family:var(--pg-font-body);font-size:13px;font-weight:600;cursor:pointer;}
.pg-btn:hover{background:var(--pg-ink-2);}
.pg-btn .a{color:var(--pg-mint);}
.pg-btn.secondary{background:transparent;color:var(--pg-ink);border:2px solid var(--pg-line);}
.pg-btn.sm{padding:5px 12px;font-size:11.5px;}
.pg-btn.mint{background:var(--pg-mint-deep);}
.field{margin-bottom:11px;}
.field label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--pg-muted);margin-bottom:4px;}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--pg-line);border-radius:9px;padding:9px 11px;font-family:var(--pg-font-body);font-size:13.5px;color:var(--pg-txt);background:#FAFCFD;outline:none;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pg-mint);}
.frow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media(max-width:860px){.frow,.frow2{grid-template-columns:1fr;}.pg-side{display:none;}}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;align-items:start;}
@media(max-width:980px){.two{grid-template-columns:1fr;}}
.evt{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--pg-line);font-size:12.5px;}
.evt:last-child{border-bottom:none;}
.evt .dot{width:8px;height:8px;border-radius:99px;background:var(--pg-mint);margin-top:5px;flex-shrink:0;}
.evt .w{color:var(--pg-muted);font-size:11px;}
.toast{position:fixed;bottom:22px;right:22px;background:var(--pg-ink);color:#fff;padding:12px 18px;border-radius:11px;font-size:13px;box-shadow:0 8px 24px rgba(27,45,58,.3);display:none;z-index:99;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--pg-bg);}

.hidden{display:none !important;}
.linkish{color:var(--pg-mint-deep);cursor:pointer;font-weight:600;}
.mono{font-family:var(--pg-font-num);}
.copybox{background:#12212B;border-radius:11px;padding:14px 16px;color:#D6E4EC;font-family:var(--pg-font-num);font-size:11.5px;line-height:1.7;white-space:pre-wrap;margin-top:10px;}
.svc-price input{width:90px;font-family:var(--pg-font-num);}

.pgprint .footline{margin-top:34px;border-top:1px solid #999;padding-top:8px;text-align:center;font-style:italic;color:#777;font-size:12px;}
/* ===== DOSIER PRINT (membrete oficial ProtectGo Services) ===== */
.pgdos{font-family:Arial,Helvetica,sans-serif;color:#333;max-width:760px;margin:0 auto;padding:40px 34px;position:relative;border-top:5px solid #2DBFA3;}
.pgdos .dhdr{text-align:center;margin-bottom:22px;}
.pgdos .dbrand{font-family:var(--pg-font-title);font-weight:800;font-size:26px;color:#1B2D3A;}

.pgdos .dmeta-top{text-align:center;font-size:11.5px;color:#6B7D89;margin-bottom:22px;}
.pgdos .dbox{background:#EEF6F3;border-radius:12px;padding:16px 20px;margin-bottom:18px;font-size:13px;line-height:1.7;}
.pgdos .dbox b{color:#1B2D3A;}
.pgdos .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
.pgdos .dfield{border:1px solid #E7EDF2;border-radius:9px;padding:10px 13px;}
.pgdos .dfield .fl{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#6B7D89;}

.pgdos table.dinv{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px;}

.pgdos .dfoot b{color:#1B2D3A;}
.paste-zone{border:2px dashed var(--pg-mint);border-radius:12px;background:#F2FBF8;padding:22px;text-align:center;color:var(--pg-mint-deep);font-size:13px;font-weight:600;margin-bottom:14px;cursor:text;outline:none;}
.paste-zone small{display:block;color:var(--pg-muted);font-weight:500;margin-top:5px;}
.paste-zone img{max-width:100%;max-height:160px;border-radius:8px;margin-top:10px;}
</style>
</head>

<script>
// Consolidacion (Fase 3): Amazon Relay contra GABI (hivpq); tablas amazon_ en schema portal.
const SB_URL='https://hivpqsepwsfmafamxkzy.supabase.co';
const SB_KEY='sb_publishable_Kak00GbGVt2K3yGh6IBZvw_99IybVvt';
const sb=window.supabase.createClient(SB_URL,SB_KEY,{db:{schema:'portal'}});
let ME=null, CLIENTES=[], SERVICIOS=[], COBROS=[], INVOICES=[], LOADS=[], REGLAS=[], REPARTOS=[], DIRECTORIO=null, VIEW='resumen', DETALLE=null, REP_PERIODO='mes';

const $=id=>document.getElementById(id);
const fmt$=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtD=d=>d? new Date(d+(d.length===10?'T12:00:00':'')).toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'}) : '—';
const esc=s=>(s??'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600);}

const ESTADOS_COBRO=['registrado','autorizado','enviado_fam','fondos_validados','pagado'];
const ESTADOS_LOAD=['cargado','en_ruta','entregado','facturado','cobrado'];
/* v5 — SOLO estos tres se pueden mover a mano. 'facturado' (En cobro) y 'cobrado' los pone el sistema. */
const ESTADOS_LOAD_MANUAL=['cargado','en_ruta','entregado'];
const ESTADOS_LOAD_AUTO=['facturado','cobrado'];
const ESTADO_LBL={registrado:'Registrado',autorizado:'Autorizado',enviado_fam:'Enviado a FAM',fondos_validados:'Fondos validados',pagado:'Pagado',por_cobrar:'Por cobrar',anulado:'Anulado',activo:'Activo',suspendido:'Suspendido',recuperacion:'Recuperación',inactivo:'Inactivo',cargado:'⏳ Pendiente',en_ruta:'🚚 En camino',entregado:'✅ Entregado',facturado:'🧾 En cobro',cobrado:'💰 Cobrado'};
const ESTADO_CLS={registrado:'n',autorizado:'warn',enviado_fam:'warn',fondos_validados:'fin',pagado:'ok',por_cobrar:'warn',anulado:'due',activo:'ok',suspendido:'due',recuperacion:'warn',inactivo:'n',cargado:'n',en_ruta:'warn',entregado:'fin',facturado:'warn',cobrado:'ok'};
const pill=e=>`<span class="pg-pill ${ESTADO_CLS[e]||'n'}">${ESTADO_LBL[e]||e}</span>`;

/* ---------- AUTH ---------- */
async function doLogin(){
  const {data,error}=await sb.auth.signInWithPassword({email:$('loginEmail').value.trim(),password:$('loginPass').value});
  if(error){$('loginErr').textContent='No se pudo entrar: '+error.message;$('loginErr').style.display='block';return;}
  boot(data.user);
}
async function doLogout(){await sb.auth.signOut();location.reload();}
async function boot(user){
  ME=user;$('footUser').textContent=user.email;(function(){if(window.pgRevisarNovedades)return;var st=document.createElement('style');st.id='pgnovStyle';st.textContent='.pgnov-ov{position:fixed;inset:0;z-index:999;background:rgba(0,30,38,.72);display:flex;align-items:center;justify-content:center;padding:18px;}.pgnov-card{background:#fff;border-radius:14px;max-width:440px;width:100%;padding:26px 28px;box-shadow:0 20px 60px rgba(0,0,0,.25);font-family:Arial,Helvetica,sans-serif;}.pgnov-tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#229A82;margin-bottom:6px;}.pgnov-card h3{margin:0 0 12px;font-size:18px;color:#002F3D;}.pgnov-card p{margin:0 0 20px;font-size:13.5px;line-height:1.6;color:#333;white-space:pre-wrap;}.pgnov-card button{width:100%;padding:11px;border:none;border-radius:9px;background:#229A82;color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;}.pgnov-card button:hover{background:#1a7a68;}.pgnov-count{font-size:11px;color:#8da0ad;text-align:center;margin-top:10px;}';document.head.appendChild(st);window.pgRevisarNovedades=function(sbClient,area){if(!sbClient||!area)return;sbClient.rpc('novedades_pendientes',{p_area:area}).then(function(r){if(r.error||!r.data||!r.data.length)return;var cola=r.data.slice();function mostrar(){if(!cola.length){var ov0=document.getElementById('pgnovOv');if(ov0)ov0.remove();return;}var n=cola[0];var ov=document.getElementById('pgnovOv');if(!ov){ov=document.createElement('div');ov.id='pgnovOv';ov.className='pgnov-ov';ov.innerHTML='<div class="pgnov-card"><div class="pgnov-tag">📢 Novedad ProtectGo</div><h3 id="pgnovT"></h3><p id="pgnovB"></p><button id="pgnovBtn" type="button">Ya lo leí, entendido</button><div class="pgnov-count" id="pgnovC"></div></div>';document.body.appendChild(ov);document.getElementById('pgnovBtn').addEventListener('click',function(){var actual=cola[0];if(!actual)return;sbClient.rpc('marcar_novedad_leida',{p_novedad_id:actual.id}).then(function(){cola.shift();mostrar();});});}document.getElementById('pgnovT').textContent=n.titulo||'';document.getElementById('pgnovB').textContent=n.cuerpo||'';document.getElementById('pgnovC').textContent=cola.length>1?('1 de '+cola.length+' novedades pendientes'):'';}mostrar();});};})();pgRevisarNovedades(sb,'amazon');
  $('loginView').classList.add('hidden');$('appView').classList.remove('hidden');
  await loadAll(); render();
}
sb.auth.getSession().then(({data})=>{if(data.session) boot(data.session.user);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('loginView').classList.contains('hidden')) doLogin();});

/* ---------- DATA ---------- */
async function loadAll(){
  const [c,s,co,inv,ld,rg,rp]=await Promise.all([
    sb.from('amazon_clientes').select('*').order('empresa'),
    sb.from('amazon_servicios').select('*').order('orden'),
    sb.from('amazon_cobros').select('*').order('created_at',{ascending:false}),
    sb.from('amazon_invoices').select('*').order('numero_seq',{ascending:false}),
    sb.from('amazon_loads').select('*').order('created_at',{ascending:false}),
    sb.from('amazon_reglas_reparto').select('*').order('tipo'),
    sb.from('amazon_repartos').select('*').order('created_at',{ascending:false}),
  ]);
  CLIENTES=c.data||[];SERVICIOS=s.data||[];COBROS=co.data||[];INVOICES=inv.data||[];LOADS=ld.data||[];REGLAS=rg.data||[];REPARTOS=rp.data||[];
}
async function evento(tipo,detalle,ids={}){
  await sb.from('amazon_eventos').insert({tipo,detalle,quien:ME.email,...ids});
}
const cliName=id=>{const c=CLIENTES.find(x=>x.id===id);return c? c.empresa : '—';};
const cli=id=>CLIENTES.find(x=>x.id===id);
const esGuia=c=>(c?.empresa||'').startsWith('🧭');
const hoyISO=()=>new Date().toISOString().slice(0,10);
const haceISO=d=>{const t=new Date();t.setDate(t.getDate()-d);return t.toISOString().slice(0,10);};

/* ---------- NAV / RENDER ---------- */
function nav(v){VIEW=v;DETALLE=null;document.querySelectorAll('.pg-side a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));render();}
function render(){
  const M=$('main');
  if(VIEW==='resumen') M.innerHTML=vResumen();
  else if(VIEW==='clientes') M.innerHTML=DETALLE? vClienteDetalle(DETALLE):vClientes();
  else if(VIEW==='loads') M.innerHTML=vLoads();
  else if(VIEW==='cobros') M.innerHTML=vCobros();
  else if(VIEW==='servicios') M.innerHTML=vServicios();
  else if(VIEW==='invoices') M.innerHTML=vInvoices();
  else if(VIEW==='reportes') M.innerHTML=vReportes();
  if(VIEW==='loads') setupPasteZone();
  if(VIEW==='clientes'&&!DETALLE) cargarDirectorio();
}

/* ---------- RESUMEN ---------- */
function vResumen(){
  const mes=new Date().getMonth(),yr=new Date().getFullYear();
  const cobrosMes=COBROS.filter(c=>{const d=new Date(c.created_at);return d.getMonth()===mes&&d.getFullYear()===yr;});
  const pagadoMes=cobrosMes.filter(c=>['fondos_validados','pagado'].includes(c.estado)).reduce((a,c)=>a+Number(c.monto),0);
  const pendiente=COBROS.filter(c=>!['fondos_validados','pagado'].includes(c.estado)).reduce((a,c)=>a+Number(c.monto),0);
  const invPorCobrar=INVOICES.filter(i=>i.estado==='por_cobrar').length;
  const ult=COBROS.slice(0,8);
  return `
  <div class="pg-eyebrow">Dashboard operativo · Amazon Audit</div>
  <h1>Amazon Relay</h1>
  <div class="pg-sub">Trazabilidad de clientes, cobros semanales, tarifas e invoices.</div>
  <div class="pg-card" style="background:#F2FBF8;border-color:var(--pg-mint)">
    <h2>🧭 Guía rápida de registro</h2>
    <div class="h2sub">Sigue este orden — pocos clics, sin pasos raros:</div>
    <div style="font-size:12.8px;color:var(--pg-txt);line-height:2.1">
      <b>1.</b> 👤 Clientes → "Registrar cliente" (empresa + DOT + contrato es lo mínimo).<br>
      <b>2.</b> 📸 Cargar viaje → llena el load del cliente.<br>
      <b>3.</b> 💵 Cobros → registra el pago semanal a debitar, avanza el estado con el botón →.<br>
      <b>4.</b> En Cobros, botón 🧾 → genera el invoice automático, ya numerado.<br>
      Hay un cliente <b>🧭 EJEMPLO GUÍA</b> ya armado de punta a punta en Clientes — ábrelo para ver cómo se ve todo lleno.
    </div>
  </div>
  <div class="pg-kpis">
    <div class="pg-kpi"><div class="lbl">Clientes activos</div><div class="val">${CLIENTES.filter(c=>c.estado==='activo').length}</div><div class="sub">${CLIENTES.length} en total</div></div>
    <div class="pg-kpi"><div class="lbl">Cobrado este mes</div><div class="val">${fmt$(pagadoMes)}</div><div class="sub">${cobrosMes.length} cobros registrados</div></div>
    <div class="pg-kpi"><div class="lbl">Pendiente por validar</div><div class="val">${fmt$(pendiente)}</div><div class="sub">en flujo con FAM</div></div>
    <div class="pg-kpi"><div class="lbl">Invoices por cobrar</div><div class="val">${invPorCobrar}</div><div class="sub">${INVOICES.length} emitidos</div></div>
  </div>
  <div class="pg-card">
    <h2>Últimos cobros</h2><div class="h2sub">Los más recientes en el flujo.</div>
    <table class="pg-table"><thead><tr><th>Cliente</th><th>Concepto</th><th>Periodo</th><th style="text-align:right">Monto</th><th>Estado</th></tr></thead><tbody>
    ${ult.map(c=>`<tr><td><span class="linkish" onclick="abrirCliente('${c.cliente_id}')">${esc(cliName(c.cliente_id))}</span></td><td>${esc(c.concepto)}</td><td>${fmtD(c.periodo_desde)} → ${fmtD(c.periodo_hasta)}</td><td class="num" style="text-align:right">${fmt$(c.monto)}</td><td>${pill(c.estado)}</td></tr>`).join('')||'<tr><td colspan="5" style="color:var(--pg-muted)">Sin cobros aún — registra el primero en 💵 Cobros.</td></tr>'}
    </tbody></table>
  </div>`;
}

async function crearCliente(){
  const empresa=$('ncEmpresa').value.trim();
  if(!empresa) return toast('Falta la empresa');
  const row={empresa,dba:$('ncDba').value.trim()||null,dot:$('ncDot').value.trim()||null,mc:$('ncMc').value.trim()||null,
    representante:$('ncRep').value.trim()||null,telefono:$('ncTel').value.trim()||null,email:$('ncEmail').value.trim()||null,
    contrato:$('ncContrato').value.trim()||null,tarifa_semanal:$('ncTarifa').value||null,codigos:$('ncCodigos').value.trim()||null,notas:$('ncNotas').value.trim()||null};
  const {data,error}=await sb.from('amazon_clientes').insert(row).select().single();
  if(error) return toast('Error: '+error.message);
  await evento('cliente_creado','Cliente registrado: '+empresa,{cliente_id:data.id});
  toast('Cliente registrado');await loadAll();render();
}
async function abrirCliente(id){
  VIEW='clientes';DETALLE=id;
  document.querySelectorAll('.pg-side a').forEach(a=>a.classList.toggle('on',a.dataset.v==='clientes'));
  const {data}=await sb.from('amazon_eventos').select('*').eq('cliente_id',id).order('created_at',{ascending:false}).limit(40);
  window._eventos=data||[];render();
}

  <div class="pg-eyebrow"><span class="linkish" onclick="nav('clientes')">← Clientes</span></div>
  <h1>${esc(c.empresa)}</h1>
  <div class="pg-sub">${c.dba?'DBA: '+esc(c.dba)+' · ':''}DOT # ${esc(c.dot||'—')} ${c.mc?'· MC '+esc(c.mc):''} · ${pill(c.estado)}</div>
  <div class="pg-kpis">
    <div class="pg-kpi"><div class="lbl">Contrato</div><div class="val" style="font-size:15px">${esc(c.contrato||'—')}</div><div class="sub">tarifa: ${c.tarifa_semanal?fmt$(c.tarifa_semanal):'—'}</div></div>
    <div class="pg-kpi"><div class="lbl">Total validado</div><div class="val">${fmt$(totalPagado)}</div><div class="sub">${cobros.length} cobros</div></div>

    <div class="pg-kpi"><div class="lbl">Códigos</div><div class="val" style="font-size:14px">${esc(c.codigos||'—')}</div><div class="sub">Rep: ${esc(c.representante||'—')}</div></div>
  </div>
  <div class="two">
    <div>
      <div class="pg-card">
        <h2>Cobros del cliente</h2><div class="h2sub">Su semana a semana.</div>
        <table class="pg-table"><thead><tr><th>Concepto</th><th>Periodo</th><th style="text-align:right">Monto</th><th>Estado</th><th></th></tr></thead><tbody>
        ${cobros.map(rowCobro).join('')||'<tr><td colspan="5" style="color:var(--pg-muted)">Sin cobros.</td></tr>'}
        </tbody></table>
      </div>
      <div class="pg-card">
        <h2>Invoices del cliente</h2>
        <table class="pg-table"><thead><tr><th>Número</th><th>Fecha</th><th style="text-align:right">Total</th><th>Estado</th><th></th></tr></thead><tbody>
        ${invs.map(rowInvoice).join('')||'<tr><td colspan="5" style="color:var(--pg-muted)">Sin invoices.</td></tr>'}

      <div style="margin-top:12px"><input id="notaTxt" placeholder="Agregar nota…" style="width:100%;border:1px solid var(--pg-line);border-radius:9px;padding:8px 11px;font-size:13px"><button class="pg-btn sm" style="margin-top:8px" onclick="agregarNota('${id}')">Guardar nota</button></div>

async function agregarNota(id){
  const t=$('notaTxt').value.trim();if(!t)return;
  await evento('nota',t,{cliente_id:id});toast('Nota guardada');abrirCliente(id);
}

/* ---------- DIRECTORIO DE LA AGENCIA ---------- */
async function cargarDirectorio(){
  if(DIRECTORIO===null){
    const {data,error}=await sb.rpc('amazon_directorio');
    if(error){DIRECTORIO=[];}else{DIRECTORIO=data||[];}
  }
  const sel=$('dirSel');if(!sel)return;
  sel.innerHTML='<option value="">— Buscar en el directorio ('+DIRECTORIO.length+' clientes de la agencia) —</option>'+
    DIRECTORIO.map((d,i)=>`<option value="${i}">${esc(d.empresa)}${d.dot?' · DOT '+esc(d.dot):''}</option>`).join('');
}
function dirAutofill(){
  const i=$('dirSel').value;if(i==='')return;
  const d=DIRECTORIO[i];if(!d)return;
  $('ncEmpresa').value=d.empresa||'';
  $('ncDot').value=d.dot||'';
  $('ncMc').value=d.mc||'';
  $('ncRep').value=d.dueno||'';
  $('ncTel').value=d.telefono||'';
  $('ncEmail').value=d.email||'';
  const veh=(d.unidades||[]).map(u=>Array.isArray(u)?u.slice(0,4).map(x=>(''+(x??'')).trim()).filter(Boolean).join(' '):'').filter(Boolean);
  $('ncNotas').value=[(d.direccion?'Dirección: '+d.direccion:''),(veh.length?'Vehículos ('+veh.length+'):\n- '+veh.join('\n- '):'')].filter(Boolean).join('\n');
  toast('Datos traídos del directorio — revisa y registra');
}

/* ---------- COBROS ---------- */
function rowCobro(c){
  const i=ESTADOS_COBRO.indexOf(c.estado);
  const next=i>=0&&i<ESTADOS_COBRO.length-1? ESTADOS_COBRO[i+1]:null;
  return `<tr><td>${esc(c.concepto)}${c.transaccion?`<div style="font-size:10.5px;color:var(--pg-muted)" class="mono">Trans #${esc(c.transaccion)}</div>`:''}</td>
  <td style="font-size:12px">${fmtD(c.periodo_desde)} → ${fmtD(c.periodo_hasta)}</td>
  <td class="num" style="text-align:right">${fmt$(c.monto)}</td><td>${pill(c.estado)}</td>
  <td style="white-space:nowrap">${next?`<button class="pg-btn sm mint" onclick="avanzarCobro('${c.id}','${next}')">→ ${ESTADO_LBL[next]}</button>`:''}
  <button class="pg-btn sm secondary" onclick="correoCobro('${c.id}')">✉</button>
  <button class="pg-btn sm secondary" onclick="invoiceDesdeCobro('${c.id}')">🧾</button></td></tr>`;
}

  <div class="two">
    <div class="pg-card">
      <h2>Libro de cobros</h2>
      <table class="pg-table"><thead><tr><th>Cliente / Concepto</th><th>Periodo</th><th style="text-align:right">Monto</th><th>Estado</th><th></th></tr></thead><tbody>
      ${COBROS.map(c=>`<tr><td><span class="linkish" onclick="abrirCliente('${c.cliente_id}')">${esc(cliName(c.cliente_id))}</span><div style="font-size:11.5px;color:var(--pg-muted)">${esc(c.concepto)}${c.transaccion?` · <span class="mono">#${esc(c.transaccion)}</span>`:''}</div></td>
        <td style="font-size:12px">${fmtD(c.periodo_desde)} → ${fmtD(c.periodo_hasta)}</td>
        <td class="num" style="text-align:right">${fmt$(c.monto)}</td><td>${pill(c.estado)}</td>
        <td style="white-space:nowrap">${(()=>{const i=ESTADOS_COBRO.indexOf(c.estado);const n=i>=0&&i<ESTADOS_COBRO.length-1?ESTADOS_COBRO[i+1]:null;return n?`<button class="pg-btn sm mint" title="Pasar a ${ESTADO_LBL[n]}" onclick="avanzarCobro('${c.id}','${n}')">→</button>`:''})()}
        <button class="pg-btn sm secondary" title="Generar correo" onclick="correoCobro('${c.id}')">✉</button>
        <button class="pg-btn sm secondary" title="Generar invoice" onclick="invoiceDesdeCobro('${c.id}')">🧾</button></td></tr>`).join('')||'<tr><td colspan="5" style="color:var(--pg-muted)">Sin cobros aún.</td></tr>'}
      </tbody></table>
      <div id="correoOut"></div>
    </div>
    <div class="pg-card">
      <h2>Registrar pago semanal a debitar</h2><div class="h2sub">Las fechas ya vienen con la última semana — solo ajústalas si es otro periodo. Cliente + monto y ya.</div>
      <div class="field"><label>Cliente *</label><select id="cbCliente">${CLIENTES.map(c=>`<option value="${c.id}">${esGuia(c)?'🧭 ':''}${esc(c.empresa)}${c.dot?' · DOT '+esc(c.dot):''}</option>`).join('')}</select></div>
      <div class="field"><label>Tipo</label><select id="cbTipo" onchange="cbTipoChange()"><option value="semanal">Pago semanal (dispatching) — el más común</option><option value="servicio">Servicio de la tabla de tarifas</option></select></div>
      <div class="field hidden" id="cbSvcWrap"><label>Servicio</label><select id="cbServicio" onchange="cbSvcChange()">${SERVICIOS.filter(s=>s.activo).map(s=>`<option value="${s.id}" data-p="${s.precio}">${esc(s.nombre)} — ${fmt$(s.precio)}${s.precio_max?'–'+fmt$(s.precio_max):''}</option>`).join('')}</select><div style="font-size:11px;color:var(--pg-muted);margin-top:4px">El monto se llena solo con la tarifa del servicio.</div></div>
      <div class="frow2">
        <div class="field"><label>Desde</label><input id="cbDesde" type="date" value="${haceISO(9)}"></div>
        <div class="field"><label>Hasta</label><input id="cbHasta" type="date" value="${hoyISO()}"></div>
      </div>
      <div class="field"><label>Monto ($) a debitar *</label><input id="cbMonto" type="number" step="0.01" placeholder="Ej: 169.12"></div>
      <div class="field"><label>Concepto <span style="font-weight:400;text-transform:none">(se llena solo, edítalo si quieres)</span></label><input id="cbConcepto" placeholder="Servicios de dispatching"></div>

function cbTipoChange(){$('cbSvcWrap').classList.toggle('hidden',$('cbTipo').value!=='servicio');if($('cbTipo').value==='servicio')cbSvcChange();else if(!$('cbConcepto').value)$('cbConcepto').value='Servicios de dispatching';}
function cbSvcChange(){
  if($('cbTipo').value!=='servicio')return;
  const o=$('cbServicio').selectedOptions[0];if(!o)return;
  $('cbMonto').value=o.dataset.p; $('cbConcepto').value=o.textContent.split('—')[0].trim();
}
async function crearCobro(){
  const cliente_id=$('cbCliente').value;const monto=parseFloat($('cbMonto').value);
  if(!cliente_id||!monto) return toast('Falta cliente o monto');
  const tipo=$('cbTipo').value;
  const row={cliente_id,tipo,monto,concepto:$('cbConcepto').value.trim()||($('cbTipo').value==='semanal'?'Servicios de dispatching':'Servicio'),
    servicio_id:tipo==='servicio'?$('cbServicio').value:null,
    periodo_desde:$('cbDesde').value||null,periodo_hasta:$('cbHasta').value||null,
    notas:$('cbNotas').value.trim()||null,created_by:ME.email};
  const {data,error}=await sb.from('amazon_cobros').insert(row).select().single();
  if(error) return toast('Error: '+error.message);
  await evento('cobro_registrado',`Cobro ${fmt$(monto)} · ${row.concepto}`,{cliente_id,cobro_id:data.id});
  toast('Cobro registrado');await loadAll();render();
}
async function avanzarCobro(id,estado){
  let transaccion=null;
  if(estado==='fondos_validados'){transaccion=prompt('Número de transacción (FAM):')||null;}
  const upd={estado};if(transaccion)upd.transaccion=transaccion;
  const {error}=await sb.from('amazon_cobros').update(upd).eq('id',id);
  if(error) return toast('Error: '+error.message);
  const c=COBROS.find(x=>x.id===id);
  await evento('cambio_estado',`Cobro pasó a ${ESTADO_LBL[estado]}${transaccion?' · Trans #'+transaccion:''}`,{cliente_id:c?.cliente_id,cobro_id:id});
  if(estado==='fondos_validados'&&c) await generarReparto(c);
  toast('Estado: '+ESTADO_LBL[estado]);await loadAll();
  if(DETALLE) abrirCliente(DETALLE); else render();
}
function correoCobro(id){
  const c=COBROS.find(x=>x.id===id);if(!c)return;
  const cl=cli(c.cliente_id)||{};
  const per=c.periodo_desde?`del ${fmtD(c.periodo_desde)} al ${fmtD(c.periodo_hasta)}`:'';
  const subject=`Pago semanal AMAZON RELAY - ${cl.empresa||''}${cl.dba?' DBA: '+cl.dba:''} DOT # ${cl.dot||''}`;
  const body=`Buenas tardes!\n\nEl cliente relacionado en esta línea de correo AUTORIZA el cobro por ${fmt$(c.monto)}, por ${c.concepto.toLowerCase().startsWith('servicio')?c.concepto.toLowerCase():'los servicios prestados de '+c.concepto.toLowerCase()} ${per}.\n\nLa información del pago ya está en la base de datos de la agencia.\n\n¡Gracias!`;
  const out=$('correoOut');
  if(out) out.innerHTML=`<div class="copybox">PARA: FAM@protectgoservices.com · CC: sales@protectgoservices.com\nASUNTO: ${esc(subject)}\n\n${esc(body)}</div><button class="pg-btn sm" style="margin-top:8px" onclick='navigator.clipboard.writeText(${JSON.stringify(subject+"\n\n"+body)}).then(()=>toast("Correo copiado"))'>Copiar correo</button>`;
  else {navigator.clipboard.writeText(subject+'\n\n'+body);toast('Correo copiado');}
}

/* ---------- REPARTOS / UTILIDADES ---------- */
function calcReparto(monto,regla){
  const r=regla||{operario_pct:0,operario_fijo:0,opex_pct:0,opex_fijo:0};
  const operario=Number(r.operario_fijo)>0?Math.min(Number(r.operario_fijo),monto):Math.round(monto*Number(r.operario_pct))/100;
  const opex=Number(r.opex_fijo)>0?Math.min(Number(r.opex_fijo),monto-operario):Math.round(monto*Number(r.opex_pct))/100;
  const utilidad=Math.round((monto-operario-opex)*100)/100;
  return {operario:Math.round(operario*100)/100,opex:Math.round(opex*100)/100,utilidad};
}
async function generarReparto(c){
  const monto=Number(c.monto);
  const regla=REGLAS.find(r=>r.tipo===(c.tipo==='semanal'?'semanal':'servicio'));
  const x=calcReparto(monto,regla);
  await sb.from('amazon_repartos').upsert({cobro_id:c.id,cliente_id:c.cliente_id,monto_bruto:monto,operario:x.operario,opex:x.opex,utilidad:x.utilidad,regla:regla?{tipo:regla.tipo,operario_pct:regla.operario_pct,operario_fijo:regla.operario_fijo,opex_pct:regla.opex_pct,opex_fijo:regla.opex_fijo}:null},{onConflict:'cobro_id'});
}
async function recalcRepartos(){
  const validados=COBROS.filter(c=>['fondos_validados','pagado'].includes(c.estado));
  let n=0;
  for(const c of validados){await generarReparto(c);n++;}
  toast(n+' cobros repartidos con la regla vigente');await loadAll();render();
}

             opex_pct:parseFloat($('rg_xp_'+id).value)||0,opex_fijo:parseFloat($('rg_xf_'+id).value)||0,updated_at:new Date().toISOString()};
  const {error}=await sb.from('amazon_reglas_reparto').update(upd).eq('id',id);

async function guardarServicio(id){

  const maxv=$('sm_'+id).value; const precio_max=maxv===''?null:parseFloat(maxv);
  const {error}=await sb.from('amazon_servicios').update({precio,precio_max}).eq('id',id);
  if(error) return toast('Error: '+error.message);
  await evento('nota',`Tarifa actualizada: ${SERVICIOS.find(s=>s.id===id)?.nombre} → ${fmt$(precio)}${precio_max?'–'+fmt$(precio_max):''}`);
  toast('Tarifa guardada');await loadAll();render();
}
async function toggleServicio(id,activo){
  await sb.from('amazon_servicios').update({activo}).eq('id',id);

}
async function crearServicio(){
  const nombre=$('nsNombre').value.trim();if(!nombre)return toast('Falta el nombre');
  const {error}=await sb.from('amazon_servicios').insert({nombre,descripcion:$('nsDesc').value.trim()||null,tipo:$('nsTipo').value,precio:parseFloat($('nsPrecio').value)||0,precio_max:$('nsMax').value?parseFloat($('nsMax').value):null,orden:SERVICIOS.length+1});

  toast('Servicio agregado');await loadAll();render();
}

async function crearInvoice(extra){
  const cliente_id=extra?.cliente_id||$('ivCliente')?.value;
  const desc=extra?.desc||$('ivDesc')?.value.trim();
  const qty=extra?.qty??(parseFloat($('ivQty')?.value)||1);
  const rate=extra?.rate??(parseFloat($('ivRate')?.value)||0);
  const metodo=extra?.metodo??($('ivMetodo')?.value.trim()||null);
  const conFee=extra?.fee??($('ivFee')?.checked||false);
  if(!cliente_id||!desc||!rate) return toast('Falta cliente, descripción o tarifa');
  const subtotal=qty*rate;
  const fee=conFee? Math.round(subtotal*0.039*100)/100 : 0;
  const items=[{descripcion:desc,qty,rate,total:subtotal}];
  if(conFee) items.push({descripcion:'Administrative Processing Fee: Applicable for the use of the payment platform (3.9%).',qty:1,rate:fee,total:fee});
  const row={cliente_id,cobro_id:extra?.cobro_id||null,metodo_pago:metodo,items,subtotal,fee_pct:conFee?3.9:0,fee,total:subtotal+fee,created_by:ME.email};
  const {data,error}=await sb.from('amazon_invoices').insert(row).select().single();
  if(error) return toast('Error: '+error.message);
  await evento('invoice_generado',`Invoice ${data.numero} · ${fmt$(data.total)}`,{cliente_id,invoice_id:data.id});
  toast('Invoice '+data.numero+' generado');
  await loadAll();render();imprimirInvoice(data.id);
}
function invoiceDesdeCobro(cobroId){
  const c=COBROS.find(x=>x.id===cobroId);if(!c)return;
  const per=c.periodo_desde?` (${fmtD(c.periodo_desde)} – ${fmtD(c.periodo_hasta)})`:'';
  crearInvoice({cliente_id:c.cliente_id,desc:(c.tipo==='semanal'?'Dispatching Service — Amazon Relay: ':'Service / Management: ')+c.concepto+per,qty:1,rate:Number(c.monto),fee:false,cobro_id:cobroId,metodo:null});
}
async function marcarPagado(id){

  ov.id = 'pgmOv'; ov.className = 'pgm-ov';
  ov.innerHTML = '<div class="pgm-card">' +
    '<h3>' + (o.titulo || '¿Confirmas?') + '</h3>' +
    '<div class="pgm-body">' + (o.cuerpo || '') + '</div>' +

    (o.aviso ? '<div class="pgm-warn">⚠️ ' + o.aviso + '</div>' : '') +
    (o.extra ? '<div class="pgm-extra">' + o.extra + '</div>' : '') +
    '<div class="pgm-actions">' +
    '<button class="pgm-btn cancel" type="button" onclick="pgCerrarModal()">' + (o.textoCancelar || 'Cancelar') + '</button>' +
    (o.onOk ? '<button class="pgm-btn ' + (o.peligro === false ? 'ok' : 'danger') + '" type="button" id="pgmOk">' + (o.textoBoton || 'Sí, eliminar') + '</button>' : '') +
    (o.onOk2 ? '<button class="pgm-btn danger" type="button" id="pgmOk2">' + (o.textoBoton2 || 'Eliminar del todo') + '</button>' : '') +
    '</div></div>';
  document.body.appendChild(ov);
  ov.addEventListener('click', function (e) { if (e.target === ov) pgCerrarModal(); });
  var btn = document.getElementById('pgmOk');
  if (btn) btn.addEventListener('click', async function () {
    btn.disabled = true; btn.textContent = 'Procesando…';
    try { if (_pgOnOk) await _pgOnOk(); } catch (err) { toast('Error: ' + (err.message || err)); }
    pgCerrarModal();
  });
  var btn2 = document.getElementById('pgmOk2');
  if (btn2) btn2.addEventListener('click', async function () {
    btn2.disabled = true; btn2.textContent = 'Procesando…';
    try { if (_pgOnOk2) await _pgOnOk2(); } catch (err) { toast('Error: ' + (err.message || err)); }
    pgCerrarModal();
  });
}

/* ---------- HELPERS DE ESQUEMA DE COBRO ----------
   calcMontoEsquema(cliente, grossTotal) -> {monto, desglose, base}
   esquemaLabel(cliente) -> texto corto para chips ("Fija $150", "9% con piso $100×2")
------------------------------------------------------------------- */
function calcMontoEsquema(c, gross) {
  gross = Number(gross) || 0;
  const tipo = (c && c.esquema_tipo) || 'fija';
  if (tipo === 'porcentaje') {
    const pct = Number(c.esquema_pct) || 0;
    const m = Math.round(pct * gross) / 100;
    return { monto: m, base: 'porcentaje', desglose: `${pct}% de ${fmt$(gross)} = ${fmt$(m)}` };
  }
  if (tipo === 'porcentaje_piso') {
    const pct = Number(c.esquema_pct) || 0, piso = Number(c.esquema_piso) || 0, u = Number(c.unidades_activas) || 1;
    const porPct = Math.round(pct * gross) / 100;
    const porPiso = Math.round(piso * u * 100) / 100;
    const m = Math.max(porPct, porPiso);
    return {
      monto: m, base: porPiso > porPct ? 'piso' : 'porcentaje',
      desglose: `${pct}% de ${fmt$(gross)} = ${fmt$(porPct)} · piso ${fmt$(piso)} × ${u} unidad${u === 1 ? '' : 'es'} = ${fmt$(porPiso)} → se cobra <b>${fmt$(m)}</b> (${porPiso > porPct ? 'gana el piso' : 'gana el %'})`
    };
  }
  const m = Number(c && c.tarifa_semanal) || 0;
  return { monto: m, base: 'fija', desglose: `Tarifa fija ${fmt$(m)}` };
}
/* v5 — desprendible que recibe la agencia por UN viaje, heredado del esquema del cliente.
   Solo aplica a esquemas porcentuales; en tarifa fija el desprendible se define en el cobro. */
function agenciaDeViaje(c, gross) {
  gross = Number(gross) || 0;
  const t = (c && c.esquema_tipo) || 'fija';
  if (t === 'porcentaje' || t === 'porcentaje_piso') {
    const pct = Number(c.esquema_pct) || 0;
    return { aplica: true, pct: pct, monto: Math.round(pct * gross) / 100 };
  }
  return { aplica: false, pct: 0, monto: null };
}
/* v5 — pinta en vivo el esquema heredado y el desprendible en el formulario de Cargar viaje.
   NO es editable: es cálculo puro del esquema del cliente × el gross que escribe el operador. */
function ldRecalcAgencia() {
  const selC = $('ldCliente'), inpT = $('ldTarifa');
  const chip = $('ldEsquemaChip'), caja = $('ldAgencia');
  if (!selC || !caja) return;
  const c = cli(selC.value);
  const gross = Number(inpT && inpT.value) || 0;
  if (chip) chip.innerHTML = c ? `<span class="pg-chip">Esquema: ${esc(esquemaLabel(c))}</span>` : '';
  if (!c) { caja.innerHTML = 'Elige cliente y escribe el gross para ver el desprendible.'; return; }
  const ag = agenciaDeViaje(c, gross);
  if (!ag.aplica) {
    caja.innerHTML = `Tarifa fija semanal — el desprendible se calcula en el cobro, no por viaje.`;
    return;
  }
  if (!gross) {
    caja.innerHTML = `Escribe el <b>gross del viaje</b> (lo que paga Amazon) y aquí verás lo que recibe la agencia (${ag.pct}%).`;
    return;
  }
  caja.innerHTML = `💵 <b>Agencia recibe: ${fmt$(ag.monto)}</b> (${ag.pct}% de ${fmt$(gross)}) · el gross completo queda registrado como ${fmt$(gross)}.`;
}
function esquemaLabel(c) {
  if (!c) return '—';
  const t = c.esquema_tipo || 'fija';
  if (t === 'porcentaje') return `${Number(c.esquema_pct) || 0}% del gross`;
  if (t === 'porcentaje_piso') return `${Number(c.esquema_pct) || 0}% con piso ${fmt$(c.esquema_piso || 0)} × ${Number(c.unidades_activas) || 1}`;
  return `Fija ${fmt$(c.tarifa_semanal || 0)}`;
}
/* Nivel comercial derivado del esquema (solo etiqueta, no se guarda) */
function nivelCliente(c) {
  if (!c) return '';
  const t = c.esquema_tipo || 'fija';
  if (t === 'fija') {
    const v = Number(c.tarifa_semanal) || 0;
    if (v === 70) return 'Nivel 1';
    if (v === 150) return 'Nivel 2';
    return '';
  }
  return 'Nivel 3';
}

var _cliEsDispatch = c => LOADS.some(l => l.cliente_id === c.id)
  || COBROS.some(co => co.cliente_id === c.id && co.tipo === 'semanal')
  || (c.esquema_tipo && c.esquema_tipo !== 'fija')
  || Number(c.tarifa_semanal) > 0;
var _cliEsServicios = c => SERVPRO.some(s => s.cliente_id === c.id);
var _cliFiltroPasa = c => {
  if (CLI_FILTRO === 'todos') return true;
  const d = _cliEsDispatch(c), s = _cliEsServicios(c);
  if (CLI_FILTRO === 'dispatching') return d;
  if (CLI_FILTRO === 'servicios') return s;
  if (CLI_FILTRO === 'ambos') return d && s;
  return true;
};
var _cliEsqObjDeForm = () => ({

});

/* ---------- CLASIFICACION: chips + filtro ---------- */
function chipsCliente(c) {
  const chips = [];
  if (_cliEsDispatch(c)) {
    const niv = nivelCliente(c);
    chips.push(`<span class="pg-chip disp">🚛 Dispatching · ${esc(esquemaLabel(c))}${niv ? ' · ' + esc(niv) : ''}</span>`);
  }
  const porTipo = {};
  servproDeCliente(c.id).forEach(s => {
    const prev = porTipo[s.tipo_servicio];
    if (!prev || new Date(s.created_at) > new Date(prev.created_at)) porTipo[s.tipo_servicio] = s;
  });
  Object.values(porTipo).forEach(s => {
    let cls = 'svc';
    if (s.estado === 'Cancelado/Fallido') cls = 'due';
    else if (s.estado === 'En proceso' || s.estado === 'Sometido a revisión') cls = 'warn';
    chips.push(`<span class="pg-chip ${cls}">🧩 ${esc(s.tipo_servicio)} · ${esc(s.estado)}</span>`);
  });
  if (!chips.length) chips.push('<span class="pg-chip">Sin clasificar</span>');
  return `<div class="pg-chipset">${chips.join('')}</div>`;
}

/* ---------- ESQUEMA: cambios en vivo + presets ---------- */
function esquemaTipoChange() {
  const sel = $('ncEsquema'); if (!sel) return;
  const t = sel.value;
  if ($('blkFija')) $('blkFija').classList.toggle('hidden', t !== 'fija');
  if ($('blkPct')) $('blkPct').classList.toggle('hidden', t === 'fija');
  if ($('blkPiso')) $('blkPiso').classList.toggle('hidden', t !== 'porcentaje_piso');
  const r = calcMontoEsquema(_cliEsqObjDeForm(), 3000);
  const d = $('ncDesglose'); if (d) d.innerHTML = `Con este esquema, una semana con gross de $3,000 se cobraría <b>${fmt$(r.monto)}</b>`;
}
function presetEsquema(k) {
  if (!$('ncEsquema')) return;
  if (k === 'n1') { $('ncEsquema').value = 'fija'; $('ncTarifa').value = 70; }
  else if (k === 'n2') { $('ncEsquema').value = 'fija'; $('ncTarifa').value = 150; }
  else if (k === 'n3') { $('ncEsquema').value = 'porcentaje'; $('ncPct').value = 9; }
  else if (k === 'n3piso') { $('ncEsquema').value = 'porcentaje_piso'; $('ncPct').value = 9; $('ncPiso').value = 100; if (!$('ncUnidades').value) $('ncUnidades').value = 1; }
  esquemaTipoChange();
}

/* ---------- CRUD ---------- */
async function crearCliente() {
  const empresa = $('ncEmpresa').value.trim();
  if (!empresa) return toast('Falta la empresa');
  const tipo = ($('ncEsquema') && $('ncEsquema').value) || 'fija';
  const row = {
    empresa, dba: $('ncDba').value.trim() || null, dot: $('ncDot').value.trim() || null, mc: $('ncMc').value.trim() || null,
    representante: $('ncRep').value.trim() || null, telefono: $('ncTel').value.trim() || null, email: $('ncEmail').value.trim() || null,
    contrato: $('ncContrato').value.trim() || null, codigos: $('ncCodigos').value.trim() || null, notas: $('ncNotas').value.trim() || null,
    esquema_tipo: tipo,
    esquema_pct: (tipo === 'porcentaje' || tipo === 'porcentaje_piso') ? (parseFloat($('ncPct').value) || 0) : null,
    esquema_piso: tipo === 'porcentaje_piso' ? (parseFloat($('ncPiso').value) || 0) : null,
    unidades_activas: parseInt(($('ncUnidades') && $('ncUnidades').value) || '1', 10) || 1,
    tarifa_semanal: tipo === 'fija' ? (parseFloat($('ncTarifa').value) || 0) : null
  };
  const editId = EDIT.cliente;
  let error, clienteId;
  if (editId) {
    const r = await sb.from('amazon_clientes').update(row).eq('id', editId).select().single();
    error = r.error; clienteId = editId;
  } else {
    const r = await sb.from('amazon_clientes').insert(row).select().single();
    error = r.error; clienteId = r.data && r.data.id;
  }
  if (error) return toast('Error: ' + error.message);
  await eventoAudit(editId ? 'editado' : 'cliente_creado', (editId ? 'Cliente editado: ' : 'Cliente registrado: ') + empresa, { cliente_id: clienteId });
  EDIT.cliente = null;
  toast(editId ? 'Cliente actualizado' : 'Cliente registrado');
  await loadAll(); render();
}
function editarCliente(id) { EDIT.cliente = id; DETALLE = null; render(); }

async function eliminarCliente(id) {
  const c = cli(id); if (!c) return;
  const loadsN = LOADS.filter(l => l.cliente_id === id).length;
  const cobrosN = COBROS.filter(x => x.cliente_id === id).length;
  const invN = INVOICES.filter(x => x.cliente_id === id).length;
  const spN = servproDeCliente(id).length;
  const total = loadsN + cobrosN + invN + spN;
  const guia = esGuia(c) ? 'Es el ejemplo guía del sistema — sirve de referencia para el equipo.' : undefined;
  if (total > 0) {
    const partes = [];
    if (loadsN) partes.push(`${loadsN} viaje${loadsN === 1 ? '' : 's'}`);
    if (cobrosN) partes.push(`${cobrosN} cobro${cobrosN === 1 ? '' : 's'}`);
    if (invN) partes.push(`${invN} invoice${invN === 1 ? '' : 's'}`);
    if (spN) partes.push(`${spN} servicio${spN === 1 ? '' : 's'} profesional${spN === 1 ? '' : 'es'}`);
    pgConfirm({
      titulo: 'Cliente con historial', peligro: false, textoBoton: 'Inactivar (recomendado)', guia,
      cuerpo: `<b>${esc(c.empresa)}</b> tiene ${partes.join(', ')} vinculados. <b>Inactivar</b> lo oculta de los formularios pero conserva toda su historia. <b>Eliminar del todo</b> lo borra a él y TODO lo suyo (${partes.join(', ')}, repartos y su trazabilidad) — no se puede deshacer.`,
      onOk: async () => {
        const { error } = await sb.from('amazon_clientes').update({ estado: 'inactivo' }).eq('id', id);
        if (error) return toast('Error: ' + error.message);
        await eventoAudit('editado', 'Cliente inactivado: ' + c.empresa, { cliente_id: id });
        toast('Cliente inactivado'); await loadAll(); render();
      },
      textoBoton2: 'Eliminar del todo',
      onOk2: async () => {
        const resumen = partes.join(', ');
        let r;
        r = await sb.from('amazon_invoices').delete().eq('cliente_id', id); if (r.error) return toast('Error borrando invoices: ' + r.error.message);
        r = await sb.from('amazon_cobros').delete().eq('cliente_id', id); if (r.error) return toast('Error borrando cobros: ' + r.error.message);
        r = await sb.from('amazon_loads').delete().eq('cliente_id', id); if (r.error) return toast('Error borrando viajes: ' + r.error.message);
        r = await sb.from('amazon_dosieres').delete().eq('cliente_id', id); if (r.error) return toast('Error borrando dosieres: ' + r.error.message);
        r = await sb.from('amazon_clientes').delete().eq('id', id); if (r.error) return toast('Error: ' + r.error.message);
        await eventoAudit('eliminado', 'Cliente eliminado del todo: ' + c.empresa + ' (incluía ' + resumen + ')', {});
        DETALLE = null; toast('Cliente y todo su historial eliminados'); await loadAll(); render();
      }
    });
  } else {
    pgConfirm({
      titulo: 'Eliminar cliente', peligro: true, textoBoton: 'Sí, eliminar', guia,

  const chipCobro = cobro ? `<div class="pg-chipset"><span class="pg-chip">🔗 En cobro · ${fmt$(cobro.monto || 0)}</span></div>` : '';
  const accionEstado = l.cobro_id

  /* v5 — desprendible: el guardado manda; si no hay, se calcula al vuelo con el esquema */
  const _ag = l.agencia_monto != null ? Number(l.agencia_monto) : agenciaDeViaje(cli(l.cliente_id), l.tarifa).monto;
  return `<tr><td><b>${esc(l.load_id_externo || '—')}</b><div style="font-size:11px;color:var(--pg-muted)">${esc(cliName(l.cliente_id))}</div>${chipCobro}</td>

  <td style="white-space:nowrap">${accionEstado}
  <button class="pg-btn sm secondary" onclick="generarDosier('${l.id}')">📑</button>

async function crearLoad() {
  const cliente_id = $('ldCliente').value;
  if (!cliente_id) return toast('Falta el cliente');
  if (!$('ldLoadId').value.trim()) return toast('Falta el Load ID');
  const row = {
    cliente_id, load_id_externo: $('ldLoadId').value.trim() || null, origen: $('ldOrigen').value.trim() || null,
    destino: $('ldDestino').value.trim() || null, fecha_hora: $('ldFecha').value ? $('ldFecha').value + 'T12:00:00' : null,
    millas: $('ldMillas').value || null, tarifa: $('ldTarifa').value || null, camion_placa: $('ldCamion').value.trim() || null,
    conductor: $('ldConductor').value.trim() || null, tipo_carga: $('ldTipo').value.trim() || null, notas: $('ldNotas').value.trim() || null,
  };
  /* v5 — el desprendible se guarda calculado (histórico estable si luego cambia el esquema) */
  row.agencia_monto = agenciaDeViaje(cli(cliente_id), row.tarifa).monto;
  if (EDIT.load) {
    const { error } = await sb.from('amazon_loads').update(row).eq('id', EDIT.load);
    if (error) return toast('Error: ' + error.message);
    await eventoAudit('editado', `Load ${row.load_id_externo || EDIT.load.slice(0, 8)} editado`, { cliente_id, load_id: EDIT.load });
    EDIT.load = null; toast('Viaje actualizado');
  } else {
    row.created_by = ME.email;
    const { data, error } = await sb.from('amazon_loads').insert(row).select().single();
    if (error) return toast('Error: ' + error.message);
    await evento('nota', `Load ${row.load_id_externo || data.id.slice(0, 8)} cargado (${row.origen || '—'} → ${row.destino || '—'})`, { cliente_id, load_id: data.id });
    toast('Viaje registrado');
  }
  _pastedImg = null; await loadAll(); render();
}

async function avanzarLoad(id, estado) {
  const l = LOADS.find(x => x.id === id);
  if (l && l.cobro_id) return toast('Este viaje sigue el estado de su cobro');
  /* v5 — 🧾 En cobro y 💰 Cobrado los pone el sistema; a mano no se llega ahí */
  if (ESTADOS_LOAD_AUTO.indexOf(estado) >= 0) return toast('"' + ESTADO_LBL[estado] + '" lo pone el sistema desde el cobro');
  const { error } = await sb.from('amazon_loads').update({ estado }).eq('id', id);
  if (error) return toast('Error: ' + error.message);
  await evento('cambio_estado', `Load ${l?.load_id_externo || id.slice(0, 8)} pasó a ${ESTADO_LBL[estado]}`, { cliente_id: l?.cliente_id, load_id: id });
  toast('Estado: ' + ESTADO_LBL[estado]); await loadAll(); render();
}

function editarLoad(id) { EDIT.load = id; render(); }

function eliminarLoad(id) {
  const l = LOADS.find(x => x.id === id);
  if (!l) return;
  const c = cli(l.cliente_id);
  const cobro = l.cobro_id ? COBROS.find(co => co.id === l.cobro_id) : null;
  pgConfirm({
    titulo: '¿Eliminar viaje?',
    cuerpo: `Vas a eliminar el load <b>${esc(l.load_id_externo || l.id.slice(0, 8))}</b>${cobro ? ` que está dentro del cobro <b>${esc(cobro.concepto || '')}</b> (${fmt$(cobro.monto || 0)}) del periodo <b>${fmtD(cobro.periodo_desde)} – ${fmtD(cobro.periodo_hasta)}</b>.` : '.'}`,
    guia: esGuia(c) ? 'Es el ejemplo guía del sistema — sirve de referencia para el equipo.' : null,
    aviso: cobro ? 'Este viaje está dentro de un cobro.' : null,
    extra: cobro ? `<label><input type="checkbox" id="delDesvincular" checked> Desvincular del cobro y borrarlo de todos modos</label>` : null,
    textoBoton: 'Sí, eliminar',
    onOk: async () => {
      if (cobro && !pgConfirmChecked('delDesvincular')) {
        toast('Desvincula el viaje del cobro primero');
        return;
      }
      if (cobro) {
        const { error: e1 } = await sb.from('amazon_loads').update({ cobro_id: null }).eq('id', id);
        if (e1) return toast('Error: ' + e1.message);
      }
      // TODO: si el FK de amazon_eventos.load_id bloquea el insert tras el delete, este evento ya se registra ANTES asi que no deberia fallar.
      await eventoAudit('eliminado', `Load ${l.load_id_externo || id.slice(0, 8)} eliminado`, { cliente_id: l.cliente_id, load_id: id });
      const { error } = await sb.from('amazon_loads').delete().eq('id', id);
      if (error) return toast('Error: ' + error.message);
      toast('Viaje eliminado'); await loadAll(); render();
    }
  });
}

/* ---------- 30-cobros.js ---------- */
/* ==================================================================

   CRUD de cobros + herencia CARGAS -> COBRO con calculo automatico.
   Declara SOLO: vCobros, rowCobro, crearCobro, avanzarCobro, editarCobro,
   eliminarCobro, cbTipoChange, cbSvcChange, cbRefrescarLoads, cbRecalcular,
   cbToggleTodos, cbBuscarLoad, verLoadsDeCobro

var _cbMontoManual = false;      // el operador piso el monto a mano
var _cbConceptoManual = false;   // el operador piso el concepto a mano
var _cbBusqueda = '';            // filtro visual de la lista de loads
/* v5 — de dónde nace el cobro: '' (nada elegido), 'viaje' o 'servpro'.
   Sin origen NO hay botón de registrar: un cobro huérfano ya no se puede crear. */
var _cbOrigen = '';
var _cbSinOrigen = false;        // escotilla admin (sales@): cobro manual sin origen

/* solo sales@ ve la escotilla de cobro manual sin origen */
function cbEsAdmin() { return !!(ME && ME.email && ME.email.toLowerCase().indexOf('sales@') === 0); }

/* servicios profesionales que se pueden cobrar: Completados, sin cobro y pendientes de facturar */
var _cbServprosElegibles = function () {
  return SERVPRO.filter(function (s) {
    return s.estado === 'Completado' && !s.cobro_id && (s.estado_cobro || 'Pendiente de facturar') === 'Pendiente de facturar';
  });
};

/* loads elegibles para un cobro: del cliente, en el periodo, sin cobro y entregado/facturado */
var _cbLoadsElegibles = function (cid, desde, hasta) {
  var d = desde || '0000-01-01', h = hasta || '9999-12-31';
  return LOADS.filter(function (l) {
    if (l.cliente_id !== cid) return false;
    if (l.cobro_id) return false;
    if (l.estado !== 'entregado' && l.estado !== 'facturado') return false;
    var f = (l.fecha_hora || '').slice(0, 10);
    if (!f) return false;
    return f >= d && f <= h;
  }).sort(function (a, b) { return (a.fecha_hora || '') < (b.fecha_hora || '') ? -1 : 1; });
};

/* ------------------------------------------------------------------ VISTA */
function vCobros() {
  var ed = EDIT.cobro ? COBROS.find(function (x) { return x.id === EDIT.cobro; }) : null;
  if (EDIT.cobro && !ed) EDIT.cobro = null;
  if (!EDIT.cobro) { _cbMontoManual = false; _cbConceptoManual = false; _cbBusqueda = ''; _cbOrigen = ''; _cbSinOrigen = false; }

  var cliSel = ed ? ed.cliente_id : (CLIENTES[0] ? CLIENTES[0].id : '');
  var desde = ed ? (ed.periodo_desde || haceISO(9)) : haceISO(9);
  var hasta = ed ? (ed.periodo_hasta || hoyISO()) : hoyISO();

  /* pinta la lista de loads y precarga el formulario justo despues del innerHTML */
  setTimeout(function () {
    if (VIEW !== 'cobros') return;
    if (!EDIT.cobro) cbOrigenChange(_cbOrigen, true);
  }, 0);

  var filas = COBROS.map(function (c) {
    var i = ESTADOS_COBRO.indexOf(c.estado);
    var n = i >= 0 && i < ESTADOS_COBRO.length - 1 ? ESTADOS_COBRO[i + 1] : null;
    var lds = loadsDeCobro(c.id);
    var chip = (c.tipo === 'semanal' && lds.length)
      ? `<span class="pg-chip disp" style="cursor:pointer" onclick="verLoadsDeCobro('${c.id}')">${lds.length} viaje${lds.length === 1 ? '' : 's'} · Gross ${fmt$(grossDeCobro(c.id))} ▾</span>`
      : '';
    var detalle = lds.length ? `<div id="lds_${c.id}" style="display:none;margin-top:6px;font-size:11.5px;color:var(--pg-muted);line-height:1.7">` +
      lds.map(function (l) { return `· <span class="mono">${esc(l.load_id_externo || '—')}</span> · ${fmtD((l.fecha_hora || '').slice(0, 10))} · ${fmt$(l.tarifa || 0)}`; }).join('<br>') +
      '</div>' : '';
    return `<tr><td><span class="linkish" onclick="abrirCliente('${c.cliente_id}')">${esc(cliName(c.cliente_id))}</span>
      <div style="font-size:11.5px;color:var(--pg-muted)">${esc(c.concepto)}${c.transaccion ? ` · <span class="mono">#${esc(c.transaccion)}</span>` : ''}${c.monto_manual ? ' · <b>manual</b>' : ''}</div>

      <td style="font-size:12px">${fmtD(c.periodo_desde)} → ${fmtD(c.periodo_hasta)}</td>
      <td class="num" style="text-align:right">${fmt$(c.monto)}${c.gross_total ? `<div style="font-size:10px;color:var(--pg-muted)">Gross ${fmt$(c.gross_total)}</div>` : ''}</td>

      <button class="pg-btn sm secondary" title="Generar correo" onclick="correoCobro('${c.id}')">✉</button>
      <button class="pg-btn sm secondary" title="Generar invoice" onclick="invoiceDesdeCobro('${c.id}')">🧾</button>
      <button class="pg-actbtn" title="Editar" onclick="editarCobro('${c.id}')">✏️</button>
      <button class="pg-actbtn" title="Eliminar" onclick="eliminarCobro('${c.id}')">🗑️</button></td></tr>`;
  }).join('') || '<tr><td colspan="5" style="color:var(--pg-muted)">Sin cobros aún.</td></tr>';

  return `
  <div class="pg-eyebrow">Cobros externos</div><h1>Cobros</h1>
  <div class="pg-sub">Un cobro nace de un <b>viaje entregado</b> o de un <b>servicio profesional completado</b> — nunca de la nada. Flujo: Registrado → Autorizado → Enviado a FAM → Fondos validados → Pagado. Al llegar a Fondos validados/Pagado, los viajes pasan solos a 💰 Cobrado.</div>
  <div class="two">
    <div class="pg-card">
      <h2>Libro de cobros</h2>
      <table class="pg-table"><thead><tr><th>Cliente / Concepto</th><th>Periodo</th><th style="text-align:right">Monto</th><th>Estado</th><th></th></tr></thead><tbody>

      <h2>${ed ? 'Editar cobro' : 'Registrar un cobro'}</h2>
      <div class="h2sub">${ed ? 'Cambia lo que necesites y guarda. Los viajes vinculados no se tocan.' : 'Un cobro siempre nace de algo ya registrado: un viaje entregado o un servicio profesional completado. Elige el origen y el resto se llena solo.'}</div>
      ${ed ? editBar('cobro', ed.concepto || 'cobro') : ''}

      ${ed ? '' : `<div class="field"><label>¿Qué vas a cobrar? *</label>
        <div class="cb-origen">
          <button type="button" class="cb-opt" id="cbOptViaje" onclick="cbOrigenChange('viaje')">🚚 Viaje / Carga logística<small>Viajes entregados sin cobrar</small></button>
          <button type="button" class="cb-opt" id="cbOptServpro" onclick="cbOrigenChange('servpro')">✳️ Servicio profesional<small>Casos completados sin facturar</small></button>
        </div>
      </div>`}

      <!-- ORIGEN: VIAJES -->
      <div id="cbPanelViaje" class="${ed ? '' : 'hidden'}">
        <div class="field"><label>Cliente *</label><select id="cbCliente" onchange="cbRefrescarLoads()">${CLIENTES.map(function (c) { return `<option value="${c.id}"${c.id === cliSel ? ' selected' : ''}>${esGuia(c) ? '🧭 ' : ''}${esc(c.empresa)}${c.dot ? ' · DOT ' + esc(c.dot) : ''}</option>`; }).join('')}</select></div>
        <div class="frow2">
          <div class="field"><label>Desde</label><input id="cbDesde" type="date" value="${desde}" onchange="cbRefrescarLoads()"></div>
          <div class="field"><label>Hasta</label><input id="cbHasta" type="date" value="${hasta}" onchange="cbRefrescarLoads()"></div>
        </div>
        <div id="cbHerencia" class="${ed ? 'hidden' : ''}">
          <div class="field"><label>Viajes entregados sin cobrar <span style="font-weight:400;text-transform:none">(marca los que entran en este cobro)</span></label>
            <input id="cbBuscar" oninput="cbBuscarLoad()" placeholder="Buscar por Load ID…" style="margin-bottom:6px">
            <div id="cbLoads" class="pg-loadpick"></div>
            <div style="margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px">
              <button type="button" class="pg-preset" onclick="cbToggleTodos()">Marcar / desmarcar todos</button>
              <span style="font-size:11.5px;color:var(--pg-muted)">Gross total: <b id="cbGross" class="num">$0.00</b></span>
            </div>
          </div>
        </div>
      </div>

      <!-- ORIGEN: SERVICIO PROFESIONAL -->
      ${ed ? '' : `<div id="cbPanelServpro" class="hidden">
        <div class="field"><label>Caso a cobrar *</label><select id="cbServpro" onchange="cbServproChange()">
          <option value="">— Elige el caso completado —</option>
          ${_cbServprosElegibles().map(function (s) { return `<option value="${s.id}">${esc(s.tipo_servicio || 'Servicio profesional')} · ${esc(cliName(s.cliente_id))}${s.id_caso ? ' · caso ' + esc(s.id_caso) : ''} — ${fmt$(s.precio || 0)}</option>`; }).join('')}
        </select>
        <div class="cb-lockrow">🔒 Cliente, concepto y precio se heredan del caso — no se digitan aquí.</div></div>
        <div id="cbServproFicha" class="cb-lock">Elige un caso para ver su ficha.</div>
      </div>`}

      <div class="field" style="margin-top:12px"><label>Monto ($) a debitar *</label><input id="cbMonto" type="number" step="0.01" placeholder="Ej: 169.12" value="${ed ? (ed.monto != null ? ed.monto : '') : ''}" ${ed ? '' : 'readonly'} oninput="_cbMontoManual=true"></div>
      <div id="cbDesglose" class="pg-desglose">${ed ? 'Cobro en edición — el monto es el que guardaste.' : 'Elige primero de dónde nace el cobro.'}</div>
      <div class="field" style="margin-top:12px"><label>Concepto <span style="font-weight:400;text-transform:none">(se llena solo — en servicio profesional lo pone el caso 🔒)</span></label><input id="cbConcepto" placeholder="Servicios de dispatching" value="${ed ? esc(ed.concepto || '') : ''}" oninput="_cbConceptoManual=true"></div>
      <div class="field"><label>Notas <span style="font-weight:400;text-transform:none">(opcional)</span></label><input id="cbNotas" value="${ed ? esc(ed.notas || '') : ''}"></div>

/* fila compacta usada en el detalle de cliente */
function rowCobro(c) {
  var i = ESTADOS_COBRO.indexOf(c.estado);
  var next = i >= 0 && i < ESTADOS_COBRO.length - 1 ? ESTADOS_COBRO[i + 1] : null;

  <td style="font-size:12px">${fmtD(c.periodo_desde)} → ${fmtD(c.periodo_hasta)}</td>
  <td class="num" style="text-align:right">${fmt$(c.monto)}</td><td>${pill(c.estado)}</td>
  <td style="white-space:nowrap">${next ? `<button class="pg-btn sm mint" onclick="avanzarCobro('${c.id}','${next}')">→ ${ESTADO_LBL[next]}</button>` : ''}

  <button class="pg-btn sm secondary" onclick="invoiceDesdeCobro('${c.id}')">🧾</button>
