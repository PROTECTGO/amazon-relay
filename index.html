<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Amazon Relay se mudó — ProtectGo</title>

<!-- ===================================================================
     Amazon Relay ya no vive en este repositorio: vive dentro del portal,
     en la carpeta amazon-relay/. Este archivo solo manda a la gente allá,
     conservando lo que venga después del ? y del #.

     El repositorio NO se borra: la herramienta completa sigue en la
     historia de git (último commit con la app: e113242).

     DESTINO: una sola línea. Cuando el portal se llame protect-index,
     cambiar a  https://protectgo.github.io/protect-index/amazon-relay/
     =================================================================== -->
<link rel="canonical" href="https://protectgo.github.io/quick-quotes/amazon-relay/">
<meta http-equiv="refresh" content="3;url=https://protectgo.github.io/quick-quotes/amazon-relay/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#1B2D3A;--mint:#2DBFA3;--mint-deep:#229A82;--mint-soft:#C4E8DF;
  --bg:#F4F7FA;--card:#FFFFFF;--line:#E7EDF2;--txt:#28323B;--muted:#6B7D89;
  --ambar:#D9A520;
  --f-tit:'Montserrat',system-ui,sans-serif;--f-body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{
  margin:0;background:var(--bg);color:var(--txt);font-family:var(--f-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
}
.card{
  width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:32px 28px;text-align:center;
  box-shadow:0 18px 44px rgba(27,45,58,.10);
}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px}
.shield{
  width:38px;height:38px;border-radius:11px;background:var(--ink);color:#fff;
  font-family:var(--f-tit);font-weight:800;font-size:15px;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.brand span{font-family:var(--f-tit);font-weight:800;font-size:18px;color:var(--ink)}
.brand span i{font-style:normal;color:var(--mint-deep)}
h1{
  font-family:var(--f-tit);font-weight:700;font-size:21px;line-height:1.35;
  color:var(--ink);margin:0 0 10px;
}
p{margin:0 0 20px;font-size:14.5px;line-height:1.6;color:var(--muted)}
.dot{
  display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ambar);
  margin-right:8px;vertical-align:middle;animation:late 1.1s ease-in-out infinite;
}
@keyframes late{0%,100%{opacity:1}50%{opacity:.25}}
.btn{
  display:inline-block;width:100%;padding:13px 18px;border-radius:12px;
  background:var(--mint-deep);color:#fff;text-decoration:none;
  font-family:var(--f-tit);font-weight:700;font-size:14.5px;
}
.btn:hover{background:var(--mint)}
.destino{
  margin:16px 0 0;font-size:12px;color:var(--muted);
  word-break:break-all;overflow-wrap:anywhere;
}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
@media (max-width:400px){
  body{padding:16px 12px}
  .card{padding:24px 18px;border-radius:14px}
  h1{font-size:19px}
}
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="shield">PG</div>
      <span>Amazon <i>Relay</i></span>
    </div>
    <h1><span class="dot" aria-hidden="true"></span>Amazon Relay se mudó, te llevamos</h1>
    <p>Ahora vive dentro del portal de ProtectGo. Te estamos abriendo la herramienta; si no pasa nada en unos segundos, entra por aquí:</p>
    <a class="btn" id="ir" href="https://protectgo.github.io/quick-quotes/amazon-relay/">Abrir Amazon Relay</a>
    <p class="destino" id="destino">https://protectgo.github.io/quick-quotes/amazon-relay/</p>
  </main>

<script>
(function(){
  /* Una sola linea que define a donde vamos. Termina en "/" a proposito. */
  var DESTINO = 'https://protectgo.github.io/quick-quotes/amazon-relay/';

  /* Conservamos lo que venga despues del ? y del # tal cual llego. */
  var destinoFinal = DESTINO + (window.location.search || '') + (window.location.hash || '');

  var ir = document.getElementById('ir');
  if (ir) { ir.setAttribute('href', destinoFinal); }
  var destino = document.getElementById('destino');
  if (destino) { destino.textContent = destinoFinal; }

  /* replace() y no assign(): el "atras" del navegador no debe devolver aqui. */
  window.setTimeout(function(){ window.location.replace(destinoFinal); }, 1200);
})();
</script>
</body>
</html>
